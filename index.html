<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100 Projects Dashboard</title>
  <meta name="description" content="Pure HTML, CSS & JS portfolio of 100 projects" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/utilities.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="header__logo">
      <div class="header__logo-icon">100</div>
      <span>Projects Dashboard</span>
    </div>

    <div class="header__progress">
      <div class="progress-bar">
        <div class="progress-bar__fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="progress-text">0 / 100 completed (0%)</div>
    </div>

    <div class="header__actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <div class="app">
    <!-- SIDEBAR FILTERS -->
    <aside class="sidebar">
      <div class="filter-group">
        <div class="filter-group__title">Search</div>
        <div class="search-box">
          <span class="search-box__icon">🔍</span>
          <input
            type="search"
            id="search-input"
            placeholder="Search projects..."
            autocomplete="off"
            aria-label="Search projects"
          />
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-group__title">Category</div>
        <div class="chip-list" id="category-chips">
          <!-- Generated by JS -->
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-group__title">Status</div>
        <div class="chip-list" id="status-chips">
          <button class="chip active" data-status="all">All</button>
          <button class="chip" data-status="completed">Completed</button>
          <button class="chip" data-status="in-progress">In Progress</button>
          <button class="chip" data-status="planned">Planned</button>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <div class="projects-header">
        <h1>All Projects</h1>
        <span class="projects-count" id="projects-count">Showing 100 of 100 projects</span>
      </div>

      <div class="projects-grid" id="projects-grid">
        <!-- Cards rendered by JS -->
      </div>

      <footer class="footer">
        Built with pure HTML, CSS &amp; JavaScript · Add your live links in <code>js/data.js</code>
      </footer>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/render.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
